<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madhavan Panchangam</title>
<link rel="preload" as="image" href="/site/images/hand.svg" fetchpriority="high">
<link rel="preload" as="font" href="/site/fonts/Belleza-Regular.woff2" type="font/woff2" crossorigin>
<script>document.documentElement.classList.add('home-loading');</script>
<link rel="stylesheet" href="/site/css/type.css?v=6">
<link rel="stylesheet" href="/site/css/home.css?v=8">
<script>
if (navigator.userAgent.includes('iPhone')) {
  const portrait = matchMedia('(orientation: portrait)');
  const measureScreen = () => {
    if (portrait.matches) {
      document.documentElement.style.setProperty('--portrait-screen-height', screen.height + 'px');
    }
  };
  measureScreen();
  portrait.addEventListener('change', measureScreen);
}
</script>
</head>
<body>
<main class="home" aria-labelledby="madpanch-right-hand-title">
  <div class="right-hand-page">
    <div class="right-hand-content">
      <div class="heading-space">
        <h1 id="madpanch-right-hand-title">Madhavan <span class="surname">Panchangam</span></h1>
      </div>
      <img class="right-hand-art" src="/site/images/hand.svg" fetchpriority="high" width="459" height="976" alt="Graphite sketch of a hand with one finger extended" draggable="false">
      <nav aria-label="Main navigation">
        <span class="nav-row">
          <a href="/work">Work</a>
          <a href="https://x.com/madpanch">Twitter</a>
        </span>
        <span class="nav-row">
          <a href="https://www.linkedin.com/in/madhavan-panchangam-79415125b/?isSelfProfile=true">LinkedIn</a>
          <a href="mailto:mpanchangam.18@gmail.com">Email</a>
        </span>
      </nav>
    </div>
  </div>
</main>
<script>
(() => {
  const art = document.querySelector('.right-hand-art');
  Promise.allSettled([
    art.decode(),
    document.fonts.load('400 1rem "Belleza"')
  ]).then(() => document.documentElement.classList.remove('home-loading'));
})();
</script>
</body>
</html>
